<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智学伴 - 管理员</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #f5f7fa; color: #333; }

    .admin-login { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); }
    .login-box h1 { text-align: center; margin-bottom: 8px; font-size: 24px; }
    .login-box .subtitle { text-align: center; color: #999; margin-bottom: 24px; font-size: 14px; }
    .login-box label { display: block; margin-bottom: 12px; font-size: 14px; color: #666; }
    .login-box input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-top: 4px; }
    .login-box button { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; }
    .login-box button:disabled { opacity: 0.6; cursor: default; }
    .login-error { color: #c62828; font-size: 13px; margin-top: 8px; text-align: center; }

    #app { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 2px solid #e5e5e5; margin-bottom: 20px; }
    .topbar h1 { font-size: 22px; }
    .topbar .right { display: flex; align-items: center; gap: 12px; }
    .logout-btn { padding: 6px 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tabs button { padding: 8px 24px; border: 1px solid #ddd; border-radius: 8px; background: #f5f5f5; cursor: pointer; font-size: 14px; }
    .tabs button.active { background: #1a73e8; color: #fff; border-color: #1a73e8; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    .toolbar input { flex: 1; min-width: 200px; }
    .toolbar button { padding: 8px 16px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    th, td { padding: 10px 14px; border-bottom: 1px solid #f0f0f0; text-align: left; font-size: 14px; }
    th { background: #fafafa; font-weight: 600; color: #555; }
    tr.disabled { opacity: 0.5; }
    .tag { padding: 2px 8px; border-radius: 4px; font-size: 12px; background: #e8e8e8; }
    .tag.admin { background: #e3f2fd; color: #1565c0; }
    .tag.active { background: #e8f5e9; color: #2e7d32; }
    .tag.disabled { background: #ffebee; color: #c62828; }
    .loading { text-align: center; padding: 40px; color: #999; }

    .actions { display: flex; gap: 6px; }
    .actions button { padding: 4px 10px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
    .btn-warn { color: #c62828; border-color: #c62828 !important; }
    .btn-ok { color: #2e7d32; border-color: #2e7d32 !important; }

    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 16px; }
    .pagination button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; }
    .pagination button:disabled { opacity: 0.4; cursor: default; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal { background: #fff; border-radius: 12px; padding: 24px; min-width: 420px; max-width: 600px; }
    .modal h3 { margin-bottom: 16px; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .detail-grid label { font-size: 12px; color: #999; display: block; }
    .detail-grid span { font-weight: 500; }
    .modal .close-btn { padding: 8px 20px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; }

    /* ── 题目管理表格专用布局 ── */
    .qtable-wrap { overflow-x: auto; }
    .qtable { table-layout: fixed; width: 100%; min-width: 1020px; }
    .qtable th, .qtable td {
      padding: 0 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    .qtable th { height: 44px; }
    .qtable td { height: 48px; }
    /* 操作列按钮不能被裁切 */
    .qtable td.q-actions { overflow: visible; }
    /* 列宽分配（百分比） */
    .qtable th:nth-child(1), .qtable td:nth-child(1) { width: 28%; }  /* 题目 */
    .qtable th:nth-child(2), .qtable td:nth-child(2) { width: 12%; }  /* 知识点 */
    .qtable th:nth-child(3), .qtable td:nth-child(3) { width: 7%; }   /* 学科 */
    .qtable th:nth-child(4), .qtable td:nth-child(4) { width: 7%; }   /* 难度 */
    .qtable th:nth-child(5), .qtable td:nth-child(5) { width: 9%; }   /* 使用/正确率 */
    .qtable th:nth-child(6), .qtable td:nth-child(6) { width: 7%; }   /* 审核 */
    .qtable th:nth-child(7), .qtable td:nth-child(7) { width: 7%; }   /* 上架 */
    .qtable th:nth-child(8), .qtable td:nth-child(8) { width: 23%; }  /* 操作 */
    .qtable td strong, .qtable td small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qtable td small { margin-top: 3px; }
    .qtable .q-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-start;
    }
    .qtable .q-actions button {
      flex: 0 0 auto;
      padding: 3px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .qtable .q-actions button:hover { background: #f5f5f5; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { createApp, ref, onMounted } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

    const API = 'http://127.0.0.1:8000'
    const TOKEN_KEY = 'admin_token'

    const app = createApp({
      setup() {
        const authed = ref(false)
        const loading = ref(false)
        const error = ref('')
        const loginForm = ref({ username: 'admin01', password: 'admin123456' })
        const tab = ref('users')

        // User management
        const users = ref([])
        const usersLoading = ref(false)
        const page = ref(1)
        const totalPages = ref(1)
        const keyword = ref('')
        const filterStatus = ref('')
        const filterRole = ref('')
        // Question management
        const questions = ref([]); const questionsLoading = ref(false)
        const qPage = ref(1); const qTotalPages = ref(1); const qTotal = ref(0)
        const qKeyword = ref(''); const qSubject = ref(''); const qDifficulty = ref(''); const qReviewStatus = ref('')
        const editingQuestion = ref(null); const questionForm = ref({})
        const subjects = ref(['数学','语文','英语','物理','化学','生物','政治','历史','地理','计算机']); const knowledgePoints = ref([])
        const detailUser = ref(null)

        // Audits
        const audits = ref([])
        const auditsLoading = ref(false)

        async function api(path, opts = {}) {
          const headers = { 'Content-Type': 'application/json' }
          const token = localStorage.getItem(TOKEN_KEY)
          if (token) headers['Authorization'] = 'Bearer ' + token
          const resp = await fetch(API + path, { headers, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined })
          const data = await resp.json()
          if (!resp.ok) throw new Error(data.message || data.detail || 'Error')
          return data
        }

        async function login() {
          loading.value = true; error.value = ''
          try {
            const resp = await api('/login/login', { method: 'POST', body: { username: loginForm.value.username, password: loginForm.value.password } })
            if (resp.user?.role !== 'admin') { error.value = '非管理员账号'; return }
            localStorage.setItem(TOKEN_KEY, resp.access_token)
            authed.value = true
            loadUsers()
          } catch (e) { error.value = e.message } finally { loading.value = false }
        }

        function logout() {
          localStorage.removeItem(TOKEN_KEY)
          authed.value = false
        }

        async function loadUsers() {
          usersLoading.value = true
          const params = new URLSearchParams({ page: page.value, page_size: 20 })
          if (keyword.value) params.set('keyword', keyword.value)
          if (filterStatus.value) params.set('status', filterStatus.value)
          if (filterRole.value) params.set('role', filterRole.value)
          try {
            const resp = await api('/admin/users?' + params)
            users.value = resp.data.items
            totalPages.value = resp.data.pages
          } catch (e) { console.error(e) } finally { usersLoading.value = false }
        }

        function searchUsers() { page.value = 1; loadUsers() }

        async function toggleStatus(u) {
          try {
            if (u.status === 'active') { await api('/admin/users/' + u.id + '/disable', { method: 'POST' }); u.status = 'disabled' }
            else { await api('/admin/users/' + u.id + '/restore', { method: 'POST' }); u.status = 'active' }
          } catch (e) { alert(e.message) }
        }

        async function viewUser(u) {
          try {
            const resp = await api('/admin/users/' + u.id)
            detailUser.value = { ...u, ...resp.data, ...(resp.data?.profile || {}) }
          } catch (e) { alert(e.message) }
        }

        async function loadQuestions() {
          questionsLoading.value = true
          const params = new URLSearchParams({ page: qPage.value, page_size: 20 })
          if (qKeyword.value) params.set('keyword', qKeyword.value)
          if (qSubject.value) params.set('subject', qSubject.value)
          if (qDifficulty.value) params.set('difficulty', qDifficulty.value)
          if (qReviewStatus.value) params.set('review_status', qReviewStatus.value)
          try {
            const resp = await api('/admin/questions?' + params)
            questions.value = resp.data.items; qTotalPages.value = resp.data.pages; qTotal.value = resp.data.total
          } catch (e) { console.error(e) } finally { questionsLoading.value = false }
        }
        async function loadSubjects() {
          try { const resp = await api('/admin/subjects'); subjects.value = resp.data || []; if (!subjects.value.length) subjects.value = ['数学','语文','英语','物理','化学','生物','政治','历史','地理','计算机'] } catch (e) { subjects.value = ['数学','语文','英语','物理','化学','生物','政治','历史','地理','计算机'] }
        }
        async function loadKnowledgePoints() {
          try { const resp = await api('/admin/knowledge-points?page_size=100'); knowledgePoints.value = resp.data.items } catch (e) {}
        }
        function openCreateForm() {
          editingQuestion.value = { _new: true }
          questionForm.value = { content: '', question_type: 'short_answer', difficulty: 'easy', subject: '', knowledge_point_name: '', standard_answer: '', analysis: '', answer_type: 'short_text', options: null }
        }
        async function editQuestion(q) {
          try {
            const resp = await api('/admin/questions/' + q.question_id)
            const d = resp.data
            editingQuestion.value = { _new: false, question_id: q.question_id }
            questionForm.value = { content: d.content, question_type: d.question_type, difficulty: d.difficulty, subject: d.subject || '', knowledge_point_name: d.knowledge_point_name || '', standard_answer: d.standard_answer || '', analysis: d.analysis || '', answer_type: d.answer_type, options: d.options }
          } catch (e) { alert(e.message) }
        }
        async function saveQuestion() {
          const payload = { ...questionForm.value }
          try {
            if (editingQuestion.value._new) {
              await api('/admin/questions', { method: 'POST', body: payload })
              alert('题目已创建')
            } else {
              await api('/admin/questions/' + editingQuestion.value.question_id, { method: 'PUT', body: payload })
              alert('题目已更新')
            }
            editingQuestion.value = null; loadQuestions()
          } catch (e) { alert(e.message) }
        }
        async function deleteQuestion(q) {
          if (!confirm('确定删除这道题目吗？')) return
          try { await api('/admin/questions/' + q.question_id, { method: 'DELETE' }); loadQuestions() } catch (e) { alert(e.message) }
        }
        async function approveQuestion(q) {
          try { await api('/admin/questions/' + q.question_id + '/approve', { method: 'POST' }); loadQuestions() } catch (e) { alert(e.message) }
        }
        async function rejectQuestion(q) {
          try { await api('/admin/questions/' + q.question_id + '/reject', { method: 'POST' }); loadQuestions() } catch (e) { alert(e.message) }
        }
        async function publishQuestion(q) {
          try { await api('/admin/questions/' + q.question_id + '/publish', { method: 'POST' }); loadQuestions() } catch (e) { alert(e.message) }
        }
        async function offShelfQuestion(q) {
          try { await api('/admin/questions/' + q.question_id + '/off-shelf', { method: 'POST' }); loadQuestions() } catch (e) { alert(e.message) }
        }
        function diffLabel(d) { return d==='easy'?'简单':d==='medium'?'中等':d==='hard'?'困难':d||'--' }
        function reviewStatusLabel(s) { return s==='published'?'已上架':s==='off_shelf'?'已下架':s||'--' }
        function statusLabel(s) { return s==='approved'?'已审核':s==='pending'?'待审核':s==='rejected'?'已驳回':s==='draft'?'草稿':s||'--' }

        async function loadAudits() {
          auditsLoading.value = true
          try {
            const resp = await api('/admin/audits?page=1&page_size=50')
            audits.value = resp.data.items
          } catch (e) { console.error(e) } finally { auditsLoading.value = false }
        }

        function switchTab(t) { tab.value = t; if (t === 'audits') loadAudits(); if (t === 'questions') { loadQuestions(); loadSubjects(); loadKnowledgePoints() } }
        function actionLabel(a) {
          const m = { login: '登录', disable_user: '禁用用户', restore_user: '恢复用户' }
          return m[a] || a
        }
        function fmtTime(t) { return t ? new Date(t).toLocaleString('zh-CN') : '-' }

        onMounted(() => {
          const t = localStorage.getItem(TOKEN_KEY)
          if (t) { authed.value = true; loadUsers() }
        })

        return { authed, loading, error, loginForm, login, logout, tab, switchTab,
          users, usersLoading, keyword, filterStatus, filterRole, page, totalPages,
          searchUsers, loadUsers, toggleStatus, viewUser, detailUser,
          audits, auditsLoading, loadAudits, actionLabel, fmtTime,
          questions, questionsLoading, qPage, qTotalPages, qTotal,
          qKeyword, qSubject, qDifficulty, qReviewStatus,
          subjects, knowledgePoints,
          loadQuestions, loadSubjects, loadKnowledgePoints,
          editingQuestion, questionForm, openCreateForm, editQuestion, saveQuestion,
          deleteQuestion, approveQuestion, rejectQuestion, publishQuestion, offShelfQuestion,
          diffLabel, reviewStatusLabel, statusLabel }
      },
      template: `
        <div v-if="!authed" class="admin-login">
          <form class="login-box" @submit.prevent="login">
            <h1>智学伴 管理员</h1>
            <p class="subtitle">仅限管理员登录</p>
            <label>用户名<input v-model="loginForm.username" autocomplete="username"></label>
            <label>密码<input v-model="loginForm.password" type="password" autocomplete="current-password"></label>
            <button :disabled="loading">{{ loading ? '登录中…' : '登录' }}</button>
            <p v-if="error" class="login-error">{{ error }}</p>
            <p style="margin-top:12px;font-size:12px;color:#999;text-align:center">演示: admin01 / admin123456</p>
          </form>
        </div>

        <div v-else id="app">
          <div class="topbar">
            <h1>智学伴 · 管理员控制台</h1>
            <div class="right"><span>admin01</span><button class="logout-btn" @click="logout">退出登录</button></div>
          </div>

          <div class="tabs">
            <button :class="{ active: tab === 'users' }" @click="switchTab('users')">用户管理</button>
            <button :class="{ active: tab === 'questions' }" @click="switchTab('questions')">题目管理</button>
            <button :class="{ active: tab === 'audits' }" @click="switchTab('audits')">操作日志</button>
          </div>

          <div v-if="tab === 'users'">
            <div class="toolbar">
              <input v-model="keyword" placeholder="搜索用户名或ID…" @keyup.enter="searchUsers">
              <select v-model="filterStatus"><option value="">全部状态</option><option value="active">正常</option><option value="disabled">已禁用</option></select>
              <select v-model="filterRole"><option value="">全部角色</option><option value="user">普通用户</option><option value="admin">管理员</option></select>
              <button @click="searchUsers">搜索</button>
            </div>
            <table>
              <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>年级</th><th>学科</th><th>诊断</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-if="usersLoading"><td colspan="8" class="loading">加载中…</td></tr>
                <tr v-else-if="users.length===0"><td colspan="8" class="loading">暂无数据</td></tr>
                <tr v-for="u in users" :key="u.id" :class="{ disabled: u.status==='disabled' }">
                  <td>{{ u.id }}</td><td><strong>{{ u.username }}</strong></td>
                  <td><span :class="'tag ' + (u.role==='admin'?'admin':'')">{{ u.role==='admin'?'管理员':'用户' }}</span></td>
                  <td><span :class="'tag ' + (u.status==='active'?'active':'disabled')">{{ u.status==='active'?'正常':'已禁用' }}</span></td>
                  <td>{{ u.grade||'-' }}</td><td>{{ u.subject||'-' }}</td><td>{{ u.diagnostic_status||'-' }}</td>
                  <td class="actions">
                    <button @click="viewUser(u)">详情</button>
                    <button v-if="u.role!=='admin'" :class="u.status==='active'?'btn-warn':'btn-ok'" @click="toggleStatus(u)">{{ u.status==='active'?'禁用':'恢复' }}</button>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="pagination" v-if="totalPages > 1">
              <button :disabled="page<=1" @click="page--;loadUsers()">上一页</button>
              <span>{{ page }} / {{ totalPages }}</span>
              <button :disabled="page>=totalPages" @click="page++;loadUsers()">下一页</button>
            </div>
          </div>

          <div v-if="tab === 'questions'">
            <div class="toolbar">
              <input v-model="qKeyword" placeholder="搜索题目内容…" @keyup.enter="qPage=1;loadQuestions()">
              <select v-model="qSubject" @change="qPage=1;loadQuestions()"><option value="">全部学科</option><option v-for="s in subjects" :key="s" :value="s">{{ s }}</option></select>
              <select v-model="qDifficulty" @change="qPage=1;loadQuestions()"><option value="">全部难度</option><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select>
              <select v-model="qReviewStatus" @change="qPage=1;loadQuestions()"><option value="">全部状态</option><option value="published">已上架</option><option value="off_shelf">已下架</option></select>
              <button @click="qPage=1;loadQuestions()">搜索</button>
              <button @click="openCreateForm()" style="background:#2e7d32;margin-left:auto">+ 新增题目</button>
            </div>
            <div class="qtable-wrap">
            <table class="qtable">
              <thead><tr><th>题目</th><th>知识点</th><th>学科</th><th>难度</th><th>使用/正确率</th><th>审核</th><th>上架</th><th>操作</th></tr></thead>
              <tbody>
                <tr v-if="questionsLoading"><td colspan="8" class="loading">加载中…</td></tr>
                <tr v-else-if="questions.length===0"><td colspan="8" class="loading">{{ qKeyword || qSubject ? '无匹配题目' : '暂无题目，点击右上角新增' }}</td></tr>
                <tr v-for="q in questions" :key="q.question_id">
                  <td :title="q.content"><strong :title="q.content">{{ q.content }}</strong><small>{{ q.question_type === 'choice' ? '选择题' : '解答题' }} · ID{{ q.question_id }}</small></td>
                  <td :title="q.knowledge_point_name">{{ q.knowledge_point_name || '--' }}</td>
                  <td>{{ q.subject || '--' }}</td>
                  <td><span :class="'tag ' + (q.difficulty==='easy'?'blue':q.difficulty==='medium'?'orange':'red')">{{ diffLabel(q.difficulty) }}</span></td>
                  <td>{{ q.usage_count }} 次 / {{ q.correct_rate }}%</td>
                  <td><span :class="'tag ' + (q.status==='approved'?'green':q.status==='pending'?'orange':'red')">{{ statusLabel(q.status) }}</span></td>
                  <td><span :class="'tag ' + (q.review_status==='published'?'green':'')">{{ reviewStatusLabel(q.review_status) }}</span></td>
                  <td class="q-actions">
                    <button @click="editQuestion(q)">编辑</button>
                    <button v-if="q.status!=='approved'" @click="approveQuestion(q)" class="btn-ok">通过</button>
                    <button v-if="q.status==='pending'" @click="rejectQuestion(q)" class="btn-warn">驳回</button>
                    <button v-if="q.review_status==='published'" @click="offShelfQuestion(q)" class="btn-warn">下架</button>
                    <button v-else @click="publishQuestion(q)" class="btn-ok">上架</button>
                    <button v-if="q.usage_count===0" @click="deleteQuestion(q)" class="btn-warn">删除</button>
                  </td>
                </tr>
              </tbody>
            </table>
            </div>
            <div class="pagination" v-if="qTotalPages > 1">
              <button :disabled="qPage<=1" @click="qPage--;loadQuestions()">上一页</button>
              <span>{{ qPage }} / {{ qTotalPages }} · 共 {{ qTotal }} 道题</span>
              <button :disabled="qPage>=qTotalPages" @click="qPage++;loadQuestions()">下一页</button>
            </div>
          </div>

          <div v-if="tab === 'audits'">
            <table>
              <thead><tr><th>ID</th><th>管理员</th><th>操作</th><th>对象</th><th>时间</th></tr></thead>
              <tbody>
                <tr v-if="auditsLoading"><td colspan="5" class="loading">加载中…</td></tr>
                <tr v-else-if="audits.length===0"><td colspan="5" class="loading">暂无日志</td></tr>
                <tr v-for="a in audits" :key="a.id">
                  <td>{{ a.id }}</td><td>{{ a.admin_username }}</td>
                  <td><span class="tag">{{ actionLabel(a.action) }}</span></td>
                  <td>{{ a.target_type }}#{{ a.target_id }}</td>
                  <td>{{ fmtTime(a.created_at) }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div v-if="detailUser" class="modal-overlay" @click.self="detailUser=null">
            <div class="modal">
              <h3>用户详情 #{{ detailUser.id }}</h3>
              <div class="detail-grid">
                <div><label>用户名</label><span>{{ detailUser.username }}</span></div>
                <div><label>角色</label><span>{{ detailUser.role }}</span></div>
                <div><label>状态</label><span>{{ detailUser.status }}</span></div>
                <div><label>学段</label><span>{{ detailUser.stage || '-' }}</span></div>
                <div><label>年级</label><span>{{ detailUser.grade || '-' }}</span></div>
                <div><label>学科</label><span>{{ detailUser.subject || '-' }}</span></div>
                <div><label>学习目标</label><span>{{ detailUser.learning_goal || '-' }}</span></div>
                <div><label>诊断状态</label><span>{{ detailUser.diagnostic_status || '-' }}</span></div>
              </div>
              <button class="close-btn" @click="detailUser=null">关闭</button>
            </div>
          </div>

          <div v-if="editingQuestion" class="modal-overlay" @click.self="editingQuestion=null">
            <div class="modal" style="max-width:650px">
              <h3>{{ editingQuestion._new ? '新增题目' : '编辑题目' }}</h3>
              <div class="form-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
                <div><label style="font-size:12px;color:#999">题型</label><select v-model="questionForm.question_type" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px"><option value="short_answer">解答题</option><option value="choice">选择题</option><option value="fill_blank">填空题</option><option value="true_false">判断题</option></select></div>
                <div><label style="font-size:12px;color:#999">难度</label><select v-model="questionForm.difficulty" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option></select></div>
                <div><label style="font-size:12px;color:#999">学科</label><select v-model="questionForm.subject" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px"><option value="">选择学科</option><option v-for="s in subjects" :key="s" :value="s">{{ s }}</option></select></div>
                <div><label style="font-size:12px;color:#999">知识点</label><input v-model="questionForm.knowledge_point_name" placeholder="如：一元一次方程" style="width:100%;padding:6px;border:1px solid #ddd;border-radius:4px"></div>
              </div>
              <div style="margin-bottom:12px"><label style="font-size:12px;color:#999">题目内容</label><textarea v-model="questionForm.content" placeholder="输入题目内容…" style="width:100%;height:80px;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px"></textarea></div>
              <div style="margin-bottom:12px"><label style="font-size:12px;color:#999">标准答案</label><input v-model="questionForm.standard_answer" placeholder="输入答案" style="width:100%;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px"></div>
              <div style="margin-bottom:12px"><label style="font-size:12px;color:#999">解析</label><textarea v-model="questionForm.analysis" placeholder="输入解析…" style="width:100%;height:60px;padding:8px;border:1px solid #ddd;border-radius:4px;font-size:14px"></textarea></div>
              <div style="display:flex;gap:8px;justify-content:flex-end">
                <button @click="editingQuestion=null" style="padding:8px 20px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">取消</button>
                <button @click="saveQuestion()" class="close-btn">保存</button>
              </div>
            </div>
          </div>
        </div>`
    })

    app.mount('#app')
  </script>
</body>
</html>
